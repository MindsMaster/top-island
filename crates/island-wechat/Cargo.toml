[package]
name = "island-wechat"
description = "WeChat 4.x message access: memory key scan, SQLCipher page decrypt, message reads."
version.workspace = true
edition.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# serialize 特性让解密库在内存直接开 不落明文盘
rusqlite = { version = "0.32", features = ["bundled", "serialize"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
regex = "1"
rayon = "1"
hmac = "0.12"
sha2 = "0.10"
pbkdf2 = "0.12"
aes = "0.8"
cbc = "0.1"
zstd = "0.13"
hex = "0.4"
md-5 = "0.10"
zeroize = "1"

[lints]
workspace = true
