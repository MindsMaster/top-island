name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7

      - name: Check tag and changelog
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 tauri.conf.json 版本 $version 不一致"
            exit 1
          fi
          if ! grep -q "^## $version " CHANGELOG.md; then
            echo "::error::CHANGELOG.md 缺少 $version 一节"
            exit 1
          fi

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # tauri build 未配置 beforeBuildCommand
      - run: pnpm build

      - name: Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Write updater key
        shell: pwsh
        env:
          UPDATER_PRIVATE_KEY: ${{ secrets.UPDATER_PRIVATE_KEY }}
        run: |
          if (-not $env:UPDATER_PRIVATE_KEY) { throw '缺少 secret UPDATER_PRIVATE_KEY' }
          $dir = Join-Path $env:USERPROFILE '.tauri'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Set-Content -NoNewline -Path (Join-Path $dir 'topisland.key') -Value $env:UPDATER_PRIVATE_KEY

      - run: cargo xtask build

      - uses: actions/upload-artifact@v7
        with:
          name: release-feed
          path: release-feed/
          if-no-files-found: error

  github-release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8
        with:
          name: release-feed
          path: release-feed

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '/^## / { if (f) exit; f = ($2 == v); next } f' CHANGELOG.md > notes.md
          flags=(--draft --notes-file notes.md --verify-tag)
          case "${GITHUB_REF_NAME^^}" in *-SNAPSHOT) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" release-feed/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" "${flags[@]}"
