[package]
name = "wxkey"
version = "0.1.0"
edition = "2024"
description = "Wechat key dump tool"

[[bin]]
name = "ti-wxkey"
path = "src/main.rs"

[profile.release]
strip = true
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[dependencies]
regex = "1"
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"
pbkdf2 = "0.12"
rayon = "1"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
] }
