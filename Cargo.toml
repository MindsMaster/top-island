[workspace]
resolver = "2"
members = ["crates/island-core", "crates/island-windows", "crates/island-wechat", "src-tauri"]

[workspace.package]
version = "0.0.1"
edition = "2021"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
