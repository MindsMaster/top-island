<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>island-spike</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  #cap {
    box-sizing: border-box;
    height: 72px;
    border-radius: 36px;
    background: rgba(20, 20, 24, 0.92);
    color: #eee;
    font: 13px/1.4 system-ui, sans-serif;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 14px;
    border: 2px solid transparent;
    transition: border-color 0.15s;
    user-select: none;
  }
  #cap.hover { border-color: #4da3ff; }
  button {
    background: #2c2c34; color: #eee; border: 1px solid #444;
    border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 12px;
  }
  button:hover { background: #3a3a44; }
  input {
    background: #1c1c22; color: #eee; border: 1px solid #444;
    border-radius: 6px; padding: 3px 8px; width: 140px; font-size: 12px;
  }
  #out {
    position: fixed; left: 0; right: 0; top: 76px;
    background: rgba(20, 20, 24, 0.92); color: #ccc;
    border-radius: 12px; padding: 8px 12px;
    font: 12px/1.5 ui-monospace, monospace;
    white-space: pre-wrap; max-height: 320px; overflow: auto;
    display: none;
  }
  #out.show { display: block; }
  #out .close { float: right; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #666; flex: none; }
  #cap.hover .dot { background: #4da3ff; }
</style>
</head>
<body>
<div id="cap">
  <span class="dot"></span>
  <span>spike</span>
  <button id="b-smtc">SMTC</button>
  <button id="b-notify">通知</button>
  <input id="aumid" placeholder="AUMID" />
  <button id="b-act">激活</button>
  <span>剪贴板 <b id="clip">0</b></span>
  <button id="b-quit">×</button>
</div>
<div id="out"><button class="close" id="b-fold">收起</button><span id="out-text"></span></div>
<script>
  const { invoke } = window.__TAURI__.core;
  const { listen } = window.__TAURI__.event;
  const cap = document.getElementById('cap');
  const out = document.getElementById('out');
  const outText = document.getElementById('out-text');
  const show = (v) => {
    out.classList.add('show');
    outText.textContent = typeof v === 'string' ? v : JSON.stringify(v, null, 2);
    invoke('set_panel_open', { open: true });
  };
  document.getElementById('b-fold').onclick = () => {
    out.classList.remove('show');
    invoke('set_panel_open', { open: false });
  };

  listen('island-hover', (e) => cap.classList.toggle('hover', !!e.payload));
  listen('clip-changed', (e) => (document.getElementById('clip').textContent = e.payload));

  document.getElementById('b-smtc').onclick = async () => {
    try { show(await invoke('smtc_now') ?? '(无会话)'); }
    catch (e) { show('SMTC 失败: ' + JSON.stringify(e)); }
  };
  document.getElementById('b-notify').onclick = async () => {
    try { show(await invoke('notify_recent', { limit: 5 })); }
    catch (e) { show('通知读取失败: ' + JSON.stringify(e)); }
  };
  document.getElementById('b-act').onclick = async () => {
    const aumid = document.getElementById('aumid').value.trim();
    if (!aumid) return show('先填 AUMID，比如微信的');
    try { show(await invoke('notify_activate', { aumid })); }
    catch (e) { show('激活失败: ' + JSON.stringify(e)); }
  };
  document.getElementById('b-quit').onclick = () =>
    window.__TAURI__.window.getCurrentWindow().close();
</script>
</body>
</html>
